<!DOCTYPE html>
<html>

<head>

<title>Base de Conocimiento</title>

<style>

body{
    margin:0;
    font-family:Segoe UI, Arial, sans-serif;
    background:#f3f6fa;
}

header{
    background:#23466a;
    color:white;
    padding:20px;
}

header h1{
    margin:0;
}

header p{
    margin-top:5px;
}

.contenedor{
    display:flex;
    height:calc(100vh - 90px);
}

.menu{
    width:300px;
    background:white;
    border-right:1px solid #ddd;
    padding:20px;
}

.contenido{
    flex:1;
    padding:30px;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:20px;
}

.menu a{
    display:block;
    background:white;
    text-decoration:none;
    color:#23466a;
    padding:15px;
    border-radius:10px;
    margin-bottom:12px;
    border:1px solid #dbe5f1;
    font-size:18px;
    font-weight:600;
    box-shadow:0 2px 5px rgba(0,0,0,.05);
    transition:0.2s;
}
    
.menu a:hover{
    background:#e9f2ff;
    transform:translateX(5px);
}
.tarjeta{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

</style>

</head>
