<!DOCTYPE html>
<html>

<head>
    <title>Prestadores Sanidad Militar</title>
</head>

<body>

<h1>Prestadores Sanidad Militar</h1>

<a href="index.html">
← Volver al Menú
</a>

<br><br>

<input
type="text"
id="buscador"
placeholder="Buscar prestador, ciudad o departamento..."
style="width:500px;padding:10px;">

<br><br>

<div id="resultado"></div>

<script>

let datos = [];

fetch("prestadores-sanidad-militar.json")
.then(respuesta => respuesta.json())
.then(json => {

    datos = json;

    document
        .getElementById("buscador")
        .addEventListener("keyup", buscar);

});

function buscar() {

    const texto =
    document
        .getElementById("buscador")
        .value
        .toLowerCase();

    const resultados =
        datos.filter(item =>

            JSON.stringify(item)
            .toLowerCase()
            .includes(texto)

        );

    let html = "";

resultados.forEach(item => {

    html += `
        <hr>

        <strong>
        ${item["NOMBRE HOMOLOGADO"]}
        </strong>

        <br>

        Departamento:
        ${item["DEPARTAMENTO"]}

        <br>

        Ciudad:
        ${item["CIUDAD"]}

        <br>

        Dirección:
        ${item["DIRECCIÓN"]}

        <br>
    `;

});
    document
        .getElementById("resultado")
        .innerHTML = html;

}

</script>

</body>

</html>
