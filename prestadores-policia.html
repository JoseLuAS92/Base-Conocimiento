<!DOCTYPE html>
<html>

<head>
    <title>Prestadores Policía</title>
</head>

<body>

<h1>Prestadores Policía</h1>

index.html← Volver al Menú</a>

<br><br>

<input
    type="text"
    id="buscador"
    placeholder="Buscar prestador, ciudad o departamento..."
    style="width:500px;padding:10px;">

<br><br>

<div id="resultado"></div>

<script>

let prestadores = [];

fetch('prestadorespolicia.json')
    .then(response => response.json())
    .then(data => {

        prestadores = data;

        document
            .getElementById("buscador")
            .addEventListener("keyup", buscar);

    });

function buscar() {

    const texto =
        document
            .getElementById("buscador")
            .value
            .toLowerCase();

    const encontrados = prestadores.filter(item =>

        JSON.stringify(item)
            .toLowerCase()
            .includes(texto)

    );

    let html = "";

    encontrados.slice(0,100).forEach(item => {

        html += `
            <hr>

            <b>${item.nombre || item["NOMBRE HOMOLOGADO"] || ""}</b><br>

            Departamento:
            ${item.departamento || item["DEPARTAMENTO"] || ""}

            <br>

            Ciudad:
            ${item.ciudad || item["CIUDAD"] || ""}

            <br>

            Dirección:
            ${item.direccion || item["DIRECCION"] || ""}

            <br>
        `;

    });

    document.getElementById("resultado").innerHTML = html;

}

</script>

</body>

</html>
