<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Plantillas</title>

<style>

body{
    font-family:Segoe UI, Arial, sans-serif;
    background:#f3f6fa;
    padding:30px;
    margin:0;
}

h1{
    color:#23466a;
}

.volver{
    display:inline-block;
    margin-bottom:25px;
    color:#23466a;
    text-decoration:none;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.tarjeta{
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    background:white;
    border-radius:15px;
    padding:25px;
    min-height:220px;
    text-decoration:none;
    color:#23466a;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    transition:.25s;
}

.tarjeta:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 20px rgba(0,0,0,.15);
}

.icono{
    font-size:50px;
    margin-bottom:15px;
}

.tarjeta h3{
    margin:0 0 10px 0;
}

.tarjeta p{
    color:#666;
}

</style>

</head>

<body>

<a href="index.html" class="volver">
← Volver al menú principal
</a>

<h1>📝 Plantillas</h1>

<div class="grid">

<a class="tarjeta"
href="Plantilla General.xlsx"
download>

<div class="icono">📄</div>

<p>

</p>

href="Plantilla Presencial.xlsx"
download>

<div class="icono">🏢</div>

<p>

</p>

</a>

href="Plantilla Web.xlsx"
download>

<p>

</p>

</a>

</div>

</body>

</html>
